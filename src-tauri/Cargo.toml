[package]
name = "oberon"
version = "0.2.5"
description = "Oberon（Tauri 2 桌面内核）"
edition = "2021"

[lib]
name = "oberon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["wry", "image-png", "image-ico", "tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 音频引擎：symphonia 纯 Rust 解码 + cpal(WASAPI) 输出
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-all"] }
# 元数据与内嵌封面
lofty = "0.25"
# 封面缩略图（解码 + 缩放 + 编码 JPEG）。image 本来就在依赖树里（tauri/lofty 间接带入），
# 这里只是把它提为直接依赖并显式打开 jpeg/png 两个编解码器。
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# 数据库（SQLite 编译进二进制）
rusqlite = { version = "0.40", features = ["bundled"] }
# 目录遍历与并行扫描
walkdir = "2.5"
rayon = "1.12"
# 目录监听（增量更新）
notify = "8.2"

[features]
# 生产构建：前端资源嵌入二进制（tauri build 使用）
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
